# K2: the Mac unit tests, on every PR and push to main that touches the Mac.
# The repository is public, so the standard macOS runner costs nothing.
name: Mac
on:
  pull_request:
    paths: ['macos/**', '.github/workflows/mac.yml']
  push:
    branches: [main]
    paths: ['macos/**', '.github/workflows/mac.yml']
  workflow_dispatch:
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  k2:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sw_vers && xcodebuild -version && swift --version
      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: k2-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: k2-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}-
      - name: Build
        working-directory: macos
        run: swift build --build-tests
      - name: Unit tests
        working-directory: macos
        run: swift test --skip-build 2>&1 | tee k2.log
      - name: Failing tests
        if: failure()
        working-directory: macos
        run: grep -E "error:|failed \(" k2.log | head -100 || true
