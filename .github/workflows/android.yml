# K1: the Android build, unit tests and lint, only when Android code changes.
# Lint runs against app/lint-baseline.xml, so only a new finding fails; it is the
# check a release build's lintVital runs, caught before the release.
name: Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  k1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew -q --no-daemon --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: k1-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          retention-days: 3
